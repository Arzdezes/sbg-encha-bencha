name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "patch_fork.py"
      - "sbg-scifi-client.user.js"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout SBG Scout
        uses: actions/checkout@v4
        with:
          repository: wrager/sbg-scout
          ref: v1.2.0
          path: scout

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Apply Sci-Fi client patch
        run: |
          python3 patch_fork.py scout sbg-scifi-client.user.js

      - name: Make Gradle wrapper executable
        run: chmod +x scout/gradlew

      - name: Build debug APK
        working-directory: scout
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find scout/app/build/outputs -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          mkdir -p output

          APK=$(find scout/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "APK found: $APK"

          cp "$APK" output/sbg-scifi-client-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbg-scifi-client-apk
          path: output/sbg-scifi-client-debug.apk
          if-no-files-found: error
          retention-days: 14
