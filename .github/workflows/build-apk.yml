name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "patch_fork.py"
      - "sbg-scifi-client.user.js"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout SBG Scout
        uses: actions/checkout@v4
        with:
          repository: wrager/sbg-scout
          ref: v1.2.0
          path: scout

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Apply Sci-Fi client patch
        run: |
          python3 patch_fork.py scout sbg-scifi-client.user.js

      - name: Make Gradle wrapper executable
        run: chmod +x scout/gradlew

      - name: Build debug APK
        working-directory: scout
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp scout/app/build/outputs/apk/debug/app-debug.apk \
             output/sbg-scifi-client-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbg-scifi-client-apk
          path: output/sbg-scifi-client-debug.apk
          if-no-files-found: error
